[project]
name = "ym-yolo"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ultralytics==8.4.168",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "onnxslim>=0.1.82",
]

[project.optional-dependencies]
tensorrt = ["tensorrt-cu13==10.13.3.9.post1"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12"]

[tool.uv.sources]
ultralytics = { path = "vendor/ultralytics", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
